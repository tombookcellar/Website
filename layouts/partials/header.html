<header>
    <a href="{{ "" | relURL }}" class="nav-logo{{ if .IsHome }} nav-logo-hidden{{ end }}">
        <img src="{{ "logo-header.svg" | relURL }}" alt="the BookCellar">
    </a>
    <button class="nav-toggle" aria-label="Toggle navigation" aria-expanded="false">
        <span></span>
        <span></span>
        <span></span>
    </button>
    <nav id="main-nav">
        <ul>
            <li><a href="{{ "" | relURL }}">Home</a></li>
            <li><a href="{{ "about/" | relURL }}">About</a></li>
            <li><a href="{{ "pairings/" | relURL }}">Book and Wine Pairings</a></li>
            <li><a href="{{ "careers/" | relURL }}">Careers</a></li>
            <li><a href="{{ "contact/" | relURL }}">Contact</a></li>
        </ul>
    </nav>
</header>
<script>
    const toggle = document.querySelector('.nav-toggle');
    const nav = document.getElementById('main-nav');
    toggle.addEventListener('click', function () {
        const open = nav.classList.toggle('nav-open');
        toggle.setAttribute('aria-expanded', open);
    });
</script>
