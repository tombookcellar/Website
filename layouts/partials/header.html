<header>
    <a href="{{ "/" | absURL }}" class="nav-logo">
        <img src="{{ "logo-header.svg" | absURL }}" alt="the BookCellar">
    </a>
    <button class="nav-toggle" aria-label="Toggle navigation" aria-expanded="false">
        <span></span>
        <span></span>
        <span></span>
    </button>
    <nav id="main-nav">
        <ul>
            <li><a href="{{ "/" | absURL }}">Home</a></li>
            <li><a href="{{ "/about/" | absURL }}">About</a></li>
            <li><a href="{{ "/careers/" | absURL }}">Careers</a></li>
            <li><a href="{{ "/contact/" | absURL }}">Contact</a></li>
        </ul>
    </nav>
</header>
<script>
    const toggle = document.querySelector('.nav-toggle');
    const nav = document.getElementById('main-nav');
    toggle.addEventListener('click', function () {
        const open = nav.classList.toggle('nav-open');
        toggle.setAttribute('aria-expanded', open);
    });
</script>
