name: Deploy Hugo site to staging

on:
  push:
    branches: ["staging"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: "staging"
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    env:
      HUGO_VERSION: 0.141.0
    steps:
      - name: Install Hugo CLI
        run: |
          wget -O ${{ runner.temp }}/hugo.deb https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.deb \
          && sudo dpkg -i ${{ runner.temp }}/hugo.deb

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build with Hugo
        env:
          HUGO_CACHEDIR: ${{ runner.temp }}/hugo_cache
          HUGO_ENVIRONMENT: staging
        run: |
          hugo \
            --gc \
            --minify \
            --baseURL "https://tombookcellar.github.io/Website-staging/"

      - name: Deploy to Website-staging
        uses: peaceiris/actions-gh-pages@v4
        with:
          personal_token: ${{ secrets.STAGING_DEPLOY_TOKEN }}
          external_repository: tombookcellar/Website-staging
          publish_branch: gh-pages
          publish_dir: ./public
